limit_req_zone $http_cf_connecting_ip zone=apirl:5m rate=5r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on; gzip_comp_level 5; gzip_min_length 512; gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 20s;
    limit_req zone=apirl burst=20 nodelay;
  }
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /img/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
  location ~* \.(?:png|jpg|jpeg|webp|ico|woff2)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri.html $uri/ /index.html; }
  error_page 404 /404.html;
}
